<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Beat and FX files
const beatFiles = {
  beat: "/assets/dubfx/beat.mp3",
  beat1: "/assets/dubfx/beat-2.mp3",
  beat2: "/assets/dubfx/beat-3.mp3"
};
const fxFiles = {
  airhorn: "/assets/dubfx/airhorn.mp3",
  siren: "/assets/dubfx/siren.mp3",
  laser: "/assets/dubfx/laser.mp3",
  scratch: "/assets/dubfx/scratch.mp3"
};

let beats = {};
let sources = {};
let gainNodes = {};
let panNodes = {};
let filterNodes = {};
let delayNodes = {};
let analysers = {};
let canvasContexts = {};
let isMuted = {};
let soloMode = null;

// Preload beats
Object.keys(beatFiles).forEach(async key => {
  const response = await fetch(beatFiles[key]);
  const arrayBuffer = await response.arrayBuffer();
  beats[key] = await audioCtx.decodeAudioData(arrayBuffer);
});

// Master gain
const masterGain = audioCtx.createGain();
masterGain.gain.value = 0.8;
masterGain.connect(audioCtx.destination);

// Master volume
document.getElementById("master-volume").addEventListener("input", e => {
  masterGain.gain.value = e.target.value;
});

// Toggle beat
function toggleBeat(key) {
  if (sources[key]) {
    sources[key].stop();
    sources[key] = null;
  } else {
    const source = audioCtx.createBufferSource();
    const gainNode = audioCtx.createGain();
    const panNode = audioCtx.createStereoPanner();
    const filter = audioCtx.createBiquadFilter();
    const delay = audioCtx.createDelay();
    const analyser = audioCtx.createAnalyser();

    source.buffer = beats[key];
    source.loop = true;

    gainNode.gain.value = document.getElementById(key + "-volume").value;
    panNode.pan.value = document.getElementById(key + "-pan").value;
    filter.frequency.value = document.getElementById(key + "-filter").value;
    delay.delayTime.value = document.getElementById(key + "-echo").value;

    document.getElementById(key + "-volume").addEventListener("input", e => { gainNode.gain.value = e.target.value; });
    document.getElementById(key + "-pan").addEventListener("input", e => { panNode.pan.value = e.target.value; });
    document.getElementById(key + "-filter").addEventListener("input", e => { filter.frequency.value = e.target.value; });
    document.getElementById(key + "-echo").addEventListener("input", e => { delay.delayTime.value = e.target.value; });

    source.connect(filter);
    filter.connect(delay);
    delay.connect(gainNode);
    gainNode.connect(panNode);
    panNode.connect(analyser);
    analyser.connect(masterGain);

    sources[key] = source;
    gainNodes[key] = gainNode;
    panNodes[key] = panNode;
    filterNodes[key] = filter;
    delayNodes[key] = delay;
    analysers[key] = analyser;

    const canvas = document.getElementById(key + "-canvas");
    const ctx = canvas.getContext("2d");
    canvasContexts[key] = ctx;
    analyser.fftSize = 256;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const barWidth = canvas.width / bufferLength;
      for (let i = 0; i < bufferLength; i++) {
        const barHeight = dataArray[i] / 2;
        ctx.fillStyle = `hsl(${i * 2}, 80%, 50%)`;
        ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth, barHeight);
      }
    }
    draw();

    source.start();
  }
}

// Mute / Solo
function muteTrack(key) {
  if (!gainNodes[key]) return;
  isMuted[key] = !isMuted[key];
  gainNodes[key].gain.value = isMuted[key] ? 0 : document.getElementById(key + "-volume").value;
}

function soloTrack(key) {
  if (soloMode === key) {
    soloMode = null;
    Object.keys(gainNodes).forEach(k => {
      gainNodes[k].gain.value = isMuted[k] ? 0 : document.getElementById(k + "-volume").value;
    });
  } else {
    soloMode = key;
    Object.keys(gainNodes).forEach(k => {
      gainNodes[k].gain.value = k === key ? document.getElementById(k + "-volume").value : 0;
    });
  }
}

// Toggle FX
let fxSources = {};
let fxGainNodes = {};
let fxDelayNodes = {};
let fxFilterNodes = {};
let fxAnalysers = {};
let fxCanvasCtx = {};

function toggleFX(key) {
  if (fxSources[key]) {
    fxSources[key].stop();
    fxSources[key] = null;
  } else {
    const source = audioCtx.createBufferSource();
    const gainNode = audioCtx.createGain();
    const delay = audioCtx.createDelay();
    const filter = audioCtx.createBiquadFilter();
    const analyser = audioCtx.createAnalyser();

    fetch(fxFiles[key]).then(res => res.arrayBuffer()).then(buf => audioCtx.decodeAudioData(buf)).then(buffer => {
      source.buffer = buffer;
      source.loop = false;

      gainNode.gain.value = document.getElementById(key + "-volume").value;
      delay.delayTime.value = document.getElementById(key + "-delay").value;
      filter.frequency.value = document.getElementById(key + "-filter").value;

      document.getElementById(key + "-volume").addEventListener("input", e => { gainNode.gain.value = e.target.value; });
      document.getElementById(key + "-delay").addEventListener("input", e => { delay.delayTime.value = e.target.value; });
      document.getElementById(key + "-filter").addEventListener("input", e => { filter.frequency.value = e.target.value; });

      source.connect(filter);
      filter.connect(delay);
      delay.connect(gainNode);
      gainNode.connect(analyser);
      analyser.connect(masterGain);

      fxSources[key] = source;
      fxGainNodes[key] = gainNode;
      fxDelayNodes[key] = delay;
      fxFilterNodes[key] = filter;
      fxAnalysers[key] = analyser;

      const canvas = document.getElementById(key + "-canvas");
      const ctx = canvas.getContext("2d");
      fxCanvasCtx[key] = ctx;
      analyser.fftSize = 256;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const barWidth = canvas.width / bufferLength;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = dataArray[i] / 2;
          ctx.fillStyle = `hsl(${i * 2}, 80%, 50%)`;
          ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth, barHeight);
        }
      }
      draw();

      source.start();
    });
  }
}
</script>
